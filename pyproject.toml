[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-iam-security-agent"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "boto3==1.35.49", "checkov==3.2.293", "langgraph==0.2.60", "openai==0.28.1",
  "pydantic==2.10.5", "pydantic-settings==2.7.1", "PyGithub==2.5.0"
]

[project.scripts]
iam-security-agent = "src.main:main"

[tool.pytest.ini_options]
pythonpath = ["."]
